# =====================================================================
#  FAITS VÉRIFIÉS — les seuls outils, chiffres, prix et licences qu'une vidéo peut citer.
#
#  verification: automatique -> chaque jour, la veille rouvre « url » et vérifie que chaque phrase de
#                               « doit_contenir » y figure encore. Phrase disparue = fait suspendu.
#  verification: manuelle    -> la page refuse les robots : elle a été lue à la main le « verifie_le ».
#                               Le fait reste utilisable « valable_jours » jours, puis il faut le relire.
#  outils   : les outils dont ce fait permet de décrire une fonction. (ChatGPT, Gemini et Claude peuvent être nommés sans fait
#             comme l'endroit où coller une instruction ; toute fonction, tout menu, toute limite demande un fait.)
#  commandes: les commandes (/mot) que ce fait permet de montrer. Une commande absente de tous les faits cités est refusée.
#  menus    : les noms de menus relevés sur la page (pour que la vidéo dise les bons mots).
#  nombres  : les chiffres que ce fait permet de citer avec une unité.
#  gratuit  : true si ce fait permet d'écrire « gratuit » (la limite doit alors être dite).
#  Avec une clé Gemini, l'agent ajoute lui-même des faits (state/faits_auto.json) : il ne garde que ceux
#  dont il retrouve la citation mot pour mot sur la page officielle.
#  Première vérification : 11 novembre 2026, en lisant directement les pages officielles.
# =====================================================================
fraicheur_jours: 3          # un fait automatique non reconfirmé depuis plus de N jours ne peut plus être cité

