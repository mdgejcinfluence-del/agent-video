# =====================================================================
#  BANQUE DE SUJETS — étude de marché du 11 novembre 2026, section 4.
#  L'ordre suit le lancement demandé : motion design, puis visuels, sites, contenus.
#
#  Règle : un sujet n'est produit que s'il existe un dossier de preuve (preuves/<id>/) qui le cite
#  dans sa liste « sujets ». Pas de preuve, pas de vidéo.
#
#  « hook » : hypothèse de rédaction à tester, pas une promesse de performance.
#  « notes » : estimation éditoriale de départ, de 0 à 5 — à corriger avec TES données
#     probleme   = à quel point ce problème pèse pour ce public
#     formation  = à quel point le sujet mène naturellement à la formation
#  « demande » : signal de demande VÉRIFIABLE, de 0 à 5. Laisse vide tant que tu n'as rien mesuré
#     (recherches TikTok Creator Search Insights, questions reçues, commentaires, messages).
#     Si tu le remplis, indique d'où vient le signal dans « demande_source ».
#  Les deux autres critères sont calculés : la preuve (dossier réel, signé ?) et la fraîcheur (veille du jour).
# =====================================================================
poids: {probleme: 30, preuve: 25, demande: 20, formation: 15, fraicheur: 10}     # en %, total 100
themes: [motion, visuels, sites, contenus]                                      # ordre de lancement

sujets:
  - n: 1
    segment: createur_freelance
    theme: motion
    sujet: "Expliquer le rôle de Claude Code et de Remotion."
    hook: "Claude écrit le code ; Remotion rend la vidéo."
    preuve: "Prompt, projet, aperçu et MP4 final."
    formation: "Comprendre le workflow et ses limites."
    notes: {probleme: 4, formation: 5}
    demande:
    demande_source: ""
    faits: [remotion-principe, remotion-claude-code]
    veille: [remotion, claude code]

