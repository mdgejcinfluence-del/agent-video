# =====================================================================
#  BANQUE D'IDÉES — ce dont le compte parle.
#
#  familles : les grands types de vidéo. « poids » = part de départ ; le bilan (tous les 3 jours) le corrige
#             d'après les mesures, sans jamais descendre sous « plancher » (chaque famille garde une chance).
#  idees    : sujets de départ. Quand ils sont tous traités, le modèle en propose de nouveaux dans les
#             familles qui marchent (state/idees.json). « faits » = faits vérifiés indispensables au sujet.
#  Une idée n'est jamais une promesse de résultat : c'est un geste, une méthode, une erreur à éviter.
# =====================================================================
plancher: 0.06
familles:
  - {id: methode,     nom: "La méthode en étapes",        poids: 0.22, titre: "N étapes / N réglages pour…",       tuile: "ÉTAPE"}
  - {id: liste,       nom: "La liste utile",              poids: 0.18, titre: "N plans / N idées / N outils pour…", tuile: "NUMÉRO"}
  - {id: erreurs,     nom: "Les erreurs à éviter",        poids: 0.18, titre: "N erreurs qui…",                    tuile: "ERREUR"}
  - {id: avant_apres, nom: "L'avant / après",             poids: 0.16, titre: "De ça à ça : …",                    tuile: "EFFET"}
  - {id: coulisses,   nom: "Les coulisses",               poids: 0.12, titre: "Comment cette vidéo est faite",     tuile: "ÉTAPE"}
  - {id: outil,       nom: "L'outil expliqué",            poids: 0.08, titre: "À quoi sert … (et ses limites)",    tuile: "NUMÉRO"}
  - {id: alerte,      nom: "L'alerte",                    poids: 0.06, titre: "Attention à …",                     tuile: "PIÈGE"}

idees:
  # --- méthode
  - {id: m01, famille: methode, sujet: "4 réglages à faire sur son téléphone avant de filmer", reserve: r6_telephone}
  - {id: m02, famille: methode, sujet: "Écrire une accroche : la première phrase qui retient", angle: "trois formes d'accroche (résultat, problème, question), avec un exemple de chacune"}
  - {id: m03, famille: methode, sujet: "Écrire le script d'une vidéo de 45 secondes en 4 parties", angle: "accroche, promesse, points, consigne finale"}
  - {id: m04, famille: methode, sujet: "Filmer un produit près d'une fenêtre : placer la lumière", angle: "de face, de côté, jamais dans le dos"}
  - {id: m05, famille: methode, sujet: "Enregistrer une voix claire avec son téléphone", angle: "pièce calme, téléphone proche de la bouche, tissu autour pour couper l'écho"}
  - {id: m06, famille: methode, sujet: "Préparer une semaine de vidéos en une seule séance", angle: "une idée par jour, mêmes réglages, tourner à la suite"}
  # --- liste
  - {id: l01, famille: liste, sujet: "5 plans à filmer pour vendre un produit", reserve: r5_plans}
  - {id: l02, famille: liste, sujet: "5 idées de vidéos quand on ne veut pas montrer son visage", angle: "mains, produit, écran, coulisses, avant/après"}
  - {id: l03, famille: liste, sujet: "4 fonds simples pour filmer un produit à la maison", angle: "tissu uni, table en bois, mur clair, feuille de papier"}
  - {id: l04, famille: liste, sujet: "5 phrases de fin qui disent clairement quoi faire", angle: "une consigne à la fois"}
  - {id: l05, famille: liste, sujet: "4 moments de la journée d'un commerce à filmer", angle: "l'ouverture, la préparation, l'emballage, la remise au client (sans montrer le client)"}
  # --- erreurs
  - {id: e01, famille: erreurs, sujet: "3 erreurs qui font zapper une vidéo dès le début", reserve: r2_zapper}
  - {id: e02, famille: erreurs, sujet: "3 erreurs de texte à l'écran", angle: "trop petit, trop long, collé aux bords où les boutons le cachent"}
  - {id: e03, famille: erreurs, sujet: "3 erreurs quand on filme un produit", angle: "fond chargé, produit trop loin, lumière dans le dos"}
  - {id: e04, famille: erreurs, sujet: "3 erreurs dans une légende de vidéo", angle: "pas d'accroche, pas d'étapes, pas de consigne"}
  # --- avant / après
  - {id: a01, famille: avant_apres, sujet: "1 rush, 5 effets : avant et après le montage", reserve: r4_effets}
  - {id: a02, famille: avant_apres, sujet: "Le même rush avec et sans sous-titres", angle: "ce qu'on comprend sans le son"}
  - {id: a03, famille: avant_apres, sujet: "Recadrer un rush : montrer le produit, pas le décor", angle: "le zoom qui guide l'œil"}
  # --- coulisses
  - {id: c01, famille: coulisses, sujet: "Cette vidéo n'a pas de monteur : comment elle est fabriquée", reserve: r1_monteur}
  - {id: c02, famille: coulisses, sujet: "Comment le programme choisit ses images", angle: "recherche, contrôle du format, contrôle de la netteté, contrôle du sujet"}
  - {id: c03, famille: coulisses, sujet: "Pourquoi ce compte ne donne jamais de chiffre sans source", angle: "chaque chiffre vient d'une page officielle, sinon il n'est pas dit"}
  # --- outil (un fait vérifié est indispensable)
  - {id: o01, famille: outil, sujet: "Où trouver des vidéos libres de droits quand on n'a pas de caméra", faits: [pexels-licence, pixabay-licence], reserve: r3_rushs}
  - {id: o02, famille: outil, sujet: "Les règles à respecter avec une vidéo de banque d'images", faits: [pexels-licence, pixabay-licence], angle: "pas de revente telle quelle, respect des personnes, pas de fausse recommandation"}
  # --- alerte
  - {id: x01, famille: alerte, sujet: "Une vidéo de banque d'images n'est pas un témoignage client", angle: "ce qui est honnête et ce qui trompe le public"}
