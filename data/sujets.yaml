# =====================================================================
#  BANQUE DE SUJETS — prompts, commandes et techniques d'intelligence artificielle
#  (ligne éditoriale du 11 novembre 2026 ; l'ancienne banque « tournage et montage » est retirée)
#
#  familles : la répartition de départ demandée. « poids » = part visée ; le bilan (tous les 3 jours) la corrige
#             d'après les mesures, sans jamais descendre sous « plancher » (chaque famille garde une chance).
#             actif: false = la famille attend un moyen technique ; ses sujets ne sont pas produits et sa part
#             est répartie sur les autres.
#  idees    : les 20 premiers sujets prioritaires. « pilote: true » = les six de la première série ; ils passent
#             avant les autres. « faits » = pages officielles indispensables au sujet (data/faits.yaml).
#             « reserve » = un storyboard écrit à l'avance existe (examples/reserve/).
#  Quand la banque est épuisée, chaque vidéo annonce la suivante, et le bilan propose de nouveaux sujets dans
#  les familles qui marchent (state/idees.json).
#
#  Un sujet doit passer ces 7 questions (elles sont aussi données au modèle qui écrit) :
#   1. Peut-il réellement intéresser un jeune ?            5. Le résultat donne-t-il envie de tester ?
#   2. Le spectateur découvre-t-il quelque chose d'utile ? 6. A-t-il sa place dans la future bibliothèque ?
#   3. Y a-t-il un prompt ou une commande à montrer ?      7. Une vidéo trop proche existe-t-elle déjà ?
#   4. La démonstration se comprend-elle vite ?
# =====================================================================
plancher: 0.03
familles:
  - {id: prompts,   nom: "Prompts ChatGPT, Gemini et Claude",       poids: 0.25, tuile: "PROMPT"}
  - {id: commandes, nom: "Commandes et fonctions méconnues",        poids: 0.15, tuile: "COMMANDE"}     # un fait vérifié (page officielle) est obligatoire
  - {id: business,  nom: "Business et entrepreneuriat",             poids: 0.15, tuile: "ÉTAPE"}
  - {id: images,    nom: "Images et création graphique",            poids: 0.15, tuile: "PROMPT", actif: false,
     attente: "il faut montrer la photo de départ et l'image obtenue : cela demande une clé payante de création d'images (l'offre gratuite de l'API Gemini n'en crée pas)"}
  - {id: video,     nom: "Vidéo et création audiovisuelle",         poids: 0.10, tuile: "ÉTAPE"}
  - {id: etudes,    nom: "Études et productivité",                  poids: 0.10, tuile: "ÉTAPE"}
  - {id: hashtags,  nom: "Hashtags et réseaux sociaux",             poids: 0.05, tuile: "ÉTAPE"}
  - {id: outils,    nom: "Autres outils et découvertes",            poids: 0.05, tuile: "OUTIL"}        # un fait vérifié est obligatoire

idees:
  # --- prompts (25 %)
  - {id: s01, pilote: true, famille: prompts, outil: ChatGPT, sujet: "Le prompt qui oblige l'IA à trouver les faiblesses de ton projet",
     angle: "l'IA joue un investisseur sceptique : cinq failles classées de la plus grave à la moins grave, et pour chacune la question à se poser"}
  - {id: s02, famille: prompts, outil: ChatGPT, sujet: "Le prompt qui fait poser cinq questions à l'IA avant qu'elle réponde",
     angle: "la réponse devient précise parce que l'IA demande d'abord ce qui lui manque"}
  - {id: s03, famille: prompts, outil: Claude, sujet: "Le prompt qui transforme un message brouillon en document professionnel",
     angle: "un message écrit vite devient une lettre claire, dans le ton choisi, sans rien inventer"}
  - {id: s04, famille: prompts, outil: Gemini, sujet: "Le prompt « assistant personnel » pour organiser ta semaine",
     angle: "tu donnes tes tâches en vrac, l'IA rend un planning jour par jour et dit ce qu'il faut reporter"}
  - {id: s05, famille: prompts, outil: ChatGPT, sujet: "Le prompt pour apprendre une compétence étape par étape, en trente jours",
     angle: "un programme jour par jour, un exercice par jour, un contrôle chaque semaine"}
  # --- commandes et fonctions méconnues (15 %) — chaque sujet s'appuie sur une page officielle
  - {id: s06, pilote: true, famille: commandes, outil: ChatGPT, sujet: "ChatGPT : écris tes consignes une seule fois (les instructions personnalisées)",
     faits: [chatgpt-instructions], reserve: p2_consignes}
  - {id: s07, famille: commandes, outil: ChatGPT, sujet: "ChatGPT sur ordinateur : tape une barre oblique dans la zone de message",
     faits: [chatgpt-commandes-bureau], angle: "ranger ses discussions avec /rename, /pin et /archive, ouvrir une discussion à côté avec /side ; dire que la liste dépend de l'application et de l'offre"}
  - {id: s08, famille: commandes, outil: "Claude Code", sujet: "Claude Code : trois commandes à connaître en premier",
     faits: [claude-code-commandes], angle: "/init, /compact et /clear ; dire clairement que ce sont des commandes de Claude Code (l'outil pour programmer), pas de l'application Claude"}
  - {id: s09, famille: commandes, outil: Claude, sujet: "Claude : range ton travail dans un Projet, avec ses propres consignes",
     faits: [claude-projets], angle: "créer un projet, y déposer ses documents, écrire les consignes du projet une fois"}
  # --- business et entrepreneuriat (15 %)
  - {id: s10, pilote: true, famille: business, outil: ChatGPT, sujet: "Le prompt pour trouver une idée de business avec ton budget", reserve: p1_business}
  - {id: s11, famille: business, outil: ChatGPT, sujet: "Le prompt pour rédiger une annonce qui attire des clients",
     angle: "le produit, le client visé, trois versions de l'annonce : courte pour un statut, détaillée pour Facebook, directe pour un message"}
  - {id: s12, famille: business, outil: Gemini, sujet: "Le prompt pour fixer le prix d'un produit",
     angle: "le coût de revient, les prix des concurrents, trois prix possibles et le risque de chacun — sans promettre de gain"}
  - {id: s13, famille: business, outil: ChatGPT, sujet: "Le prompt pour comprendre tes concurrents du quartier",
     angle: "tu décris trois concurrents, l'IA rend un tableau : ce qu'ils font bien, ce qui manque, où te placer"}
  # --- images et création graphique (15 %, en attente : voir la famille)
  - {id: s14, famille: images, outil: Gemini, sujet: "Le prompt pour transformer une photo ordinaire en portrait de studio"}
  - {id: s15, famille: images, outil: ChatGPT, sujet: "Le prompt pour une affiche publicitaire de ton produit"}
  # --- vidéo et création audiovisuelle (10 %)
  - {id: s16, pilote: true, famille: video, outil: ChatGPT, sujet: "Le prompt pour écrire le scénario d'une publicité courte",
     angle: "une accroche, trois plans, une phrase de fin : le texte dit, ce qu'on voit, la durée de chaque plan"}
  - {id: s17, famille: video, outil: Claude, sujet: "Le prompt pour transformer une idée en storyboard, plan par plan",
     angle: "un tableau : numéro du plan, ce qu'on voit, ce qu'on entend, l'objet à préparer"}
  # --- études et productivité (10 %)
  - {id: s18, pilote: true, famille: etudes, outil: ChatGPT, sujet: "Le prompt qui transforme ChatGPT en professeur particulier",
     angle: "l'IA explique simplement, donne un exemple de la vie courante, puis pose ses questions une à une sans donner la réponse tout de suite"}
  - {id: s19, famille: etudes, outil: Gemini, sujet: "Le prompt pour transformer un chapitre en fiche de révision",
     angle: "les idées à retenir, les définitions, cinq questions d'entraînement avec leurs réponses cachées à la fin"}
  # --- hashtags et réseaux sociaux (5 %)
  - {id: s20, pilote: true, famille: hashtags, outil: ChatGPT, sujet: "Le prompt pour trouver les hashtags de ta page Facebook",
     angle: "quinze hashtags classés : larges, de niche, locaux ; rappeler qu'un hashtag classe une publication et n'est pas une commande donnée à l'IA"}
