# Le « serveur » gratuit de l'agent : GitHub réveille cette tâche aux heures ci-dessous. L'agent fait son
# travail tout seul (mesures -> bilan tous les 3 jours -> veille -> choix du sujet -> écriture -> rushs ->
# vidéo -> publication), enregistre sa mémoire dans le dépôt, puis la machine s'éteint.
#
# Aucune clé n'est écrite dans le code : elles sont lues dans Settings > Secrets and variables > Actions.
#   GEMINI_API_KEY                    le cerveau : écrit les scénarios, regarde les rushs, rédige le bilan
#   PEXELS_API_KEY, PIXABAY_API_KEY   la recherche de séquences filmées libres de droits
#   BUFFER_API_KEY                    la publication (Facebook, Instagram, TikTok) et les statistiques
# Tant qu'aucune clé de publication n'existe, chaque réveil est un essai : rien n'est publié.
# Le jour où elle est ajoutée, l'agent publie, sans validation et sans autre réglage.
# Pour tout arrêter : « dry_run: true » dans config.yaml, ou désactiver cette tâche (bouton « … » en haut à droite).
#
# Les heures sont en UTC. Cotonou = UTC+1 : 08:40 UTC = 09:40 chez toi, soit 20 minutes avant le créneau de 10:00.
# Si tu changes schedule.slots dans config.yaml, change aussi les lignes « cron ».
name: Agent vidéo

on:
  schedule:
    - cron: "40 8 * * *"      # créneau 10:00 (heure de Cotonou)
    - cron: "40 11 * * *"     # créneau 13:00
    - cron: "40 16 * * *"     # créneau 18:00
    - cron: "10 19 * * *"     # créneau 20:30
    - cron: "40 5,22 * * *"   # relevé des statistiques, bilan, veille, rattrapage d'un créneau manqué
  workflow_dispatch:
    inputs:
      commande:
        description: "tick (réveil normal) | demo (les 6 vidéos de réserve) | bilan | doctor | plan | sujets | veille | rushs"
        default: "tick"
      mots:
        description: "Pour « rushs » : la recherche à essayer, en anglais (ex. hands packing box)"
        default: ""
      forcer:
        description: "Fabriquer une vidéo tout de suite, même hors créneau"
        type: boolean
        default: false

permissions:
  contents: write          # pour enregistrer la mémoire (state/) et la branche studio-media

concurrency:
  group: agent-video
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      # On part toujours de la dernière version de la branche (et non de celle du moment où la tâche a été
      # demandée) : si deux réveils se suivent, le second voit bien la mémoire enregistrée par le premier.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache du navigateur de rendu et des voix
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            .voices
          key: outils-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Installation
        run: bash setup.sh

      - name: Tests (logique interne, sans réseau)
        run: python -m unittest discover -s tests

      - name: Agent
        env:
          COMMANDE: ${{ inputs.commande || 'tick' }}
          MOTS: ${{ inputs.mots || '' }}
          FORCER: ${{ inputs.forcer && '--force' || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}            # fourni par GitHub à chaque exécution (rien à créer)
          # --- les clés à ajouter dans les Secrets du dépôt
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          # --- facultatives (laisse-les absentes si tu ne t'en sers pas)
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          case "$COMMANDE" in
            tick)    python run.py tick $FORCER ;;
            demo)    python run.py demo ;;
            bilan)   python run.py bilan ;;
            doctor)  python run.py doctor --live ;;
            plan)    python run.py plan ;;
            sujets)  python run.py sujets ;;
            veille)  python run.py veille ;;
            rushs)   python run.py rushs "${MOTS:-hands typing laptop}" ;;
            *)       echo "commande inconnue : $COMMANDE" && exit 2 ;;
          esac

      - name: Enregistrer la mémoire de l'agent
        if: always()
        run: |
          # identité officielle des commits faits par GitHub Actions (aucun compte de personne n'est cité)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BR="${GITHUB_REF_NAME}"
          git add state
          if git diff --cached --quiet; then echo "mémoire inchangée"; exit 0; fi
          git commit -q -m "mémoire : $(date -u +%Y-%m-%dT%H:%MZ)"
          for essai in 1 2 3; do
            if git push -q origin "HEAD:${BR}"; then echo "mémoire enregistrée dans le dépôt"; exit 0; fi
            # Le dépôt a changé pendant l'exécution (par exemple config.yaml modifié à la main) :
            # on reprend sa version, on y repose NOTRE mémoire (state/), et on réessaie.
            rm -rf "${RUNNER_TEMP}/etat" && cp -r state "${RUNNER_TEMP}/etat"
            git fetch -q origin "${BR}"
            git reset -q --hard "origin/${BR}"
            rm -rf state && cp -r "${RUNNER_TEMP}/etat" state
            git add state
            git diff --cached --quiet || git commit -q -m "mémoire : $(date -u +%Y-%m-%dT%H:%MZ)"
            sleep $((essai * 3))
          done
          echo "::error::la mémoire de l'agent n'a pas pu être enregistrée dans le dépôt"
          exit 1

      - name: Garder les vidéos et leurs fiches de production 14 jours (onglet Actions > cette exécution > Artifacts)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: videos-${{ github.run_id }}
          path: |
            out/*.mp4
            out/*.jpg
            out/*.md
            out/*.json
          if-no-files-found: ignore
          retention-days: 14
