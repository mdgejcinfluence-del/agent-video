# Le « serveur » gratuit de l'agent : GitHub réveille cette tâche aux heures ci-dessous,
# l'agent fait son travail (statistiques -> décision -> vidéo -> publication), enregistre
# sa mémoire dans le dépôt, puis la machine s'éteint. Ton ordinateur peut rester éteint.
#
# Aucune clé n'est écrite dans le code : elles sont lues dans Settings > Secrets and variables > Actions.
# Les 3 qui comptent : NVIDIA_API_KEY et GROQ_API_KEY (écriture des scénarios), BUFFER_API_KEY (publication).
# Tant que config.yaml contient « dry_run: true », chaque réveil est un essai : rien n'est publié.
#
# Les heures sont en UTC. Cotonou = UTC+1 : 06:20 UTC = 07:20 chez toi.
# Si tu changes schedule.slots dans config.yaml, change aussi les lignes « cron »
# (chaque créneau moins 10 minutes, converti en UTC).
name: Agent vidéo

on:
  schedule:
    - cron: "20 6 * * *"     # créneau 07:30 (heure de Cotonou)
    - cron: "20 11 * * *"    # créneau 12:30
    - cron: "20 17 * * *"    # créneau 18:30
    - cron: "20 19 * * *"    # créneau 20:30
    - cron: "40 9,22 * * *"  # relevé des statistiques + rattrapage d'un créneau manqué
  workflow_dispatch:
    inputs:
      commande:
        description: "tick (réveil normal) | demo (vidéo d'exemple) | doctor (vérification des clés et de l'hébergement des vidéos) | plan (ce que l'agent a appris)"
        default: "tick"
      forcer:
        description: "Fabriquer une vidéo tout de suite, même hors créneau"
        type: boolean
        default: false

permissions:
  contents: write          # pour enregistrer la mémoire (state/) et la branche studio-media

concurrency:
  group: agent-video
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # On part toujours de la dernière version de la branche (et non de celle du moment où la tâche a été
      # demandée) : si deux réveils se suivent, le second voit bien la mémoire enregistrée par le premier.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache du navigateur de rendu et des voix
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            .voices
          key: outils-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Installation
        run: bash setup.sh

      - name: Tests (logique interne, sans réseau)
        run: python -m unittest discover -s tests

      - name: Agent
        env:
          COMMANDE: ${{ inputs.commande || 'tick' }}
          FORCER: ${{ inputs.forcer && '--force' || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}            # fourni par GitHub à chaque exécution (rien à créer)
          # --- les 3 clés à ajouter dans les Secrets du dépôt
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          # --- facultatives (laisse-les absentes si tu ne t'en sers pas)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          case "$COMMANDE" in
            tick)   python run.py tick $FORCER ;;
            demo)   python run.py demo ;;
            doctor) python run.py doctor --live ;;
            plan)   python run.py plan ;;
            *)      echo "commande inconnue : $COMMANDE" && exit 2 ;;
          esac

      - name: Enregistrer la mémoire de l'agent
        if: always()
        run: |
          # identité officielle des commits faits par GitHub Actions (aucun compte de personne n'est cité)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BR="${GITHUB_REF_NAME}"
          git add state
          if git diff --cached --quiet; then echo "mémoire inchangée"; exit 0; fi
          git commit -q -m "mémoire : $(date -u +%Y-%m-%dT%H:%MZ)"
          for essai in 1 2 3; do
            if git push -q origin "HEAD:${BR}"; then echo "mémoire enregistrée dans le dépôt"; exit 0; fi
            # Le dépôt a changé pendant l'exécution (par exemple config.yaml modifié à la main) :
            # on reprend sa version, on y repose NOTRE mémoire (state/), et on réessaie.
            rm -rf "${RUNNER_TEMP}/etat" && cp -r state "${RUNNER_TEMP}/etat"
            git fetch -q origin "${BR}"
            git reset -q --hard "origin/${BR}"
            rm -rf state && cp -r "${RUNNER_TEMP}/etat" state
            git add state
            git diff --cached --quiet || git commit -q -m "mémoire : $(date -u +%Y-%m-%dT%H:%MZ)"
            sleep $((essai * 3))
          done
          echo "::error::la mémoire de l'agent n'a pas pu être enregistrée dans le dépôt"
          exit 1

      - name: Garder les vidéos 14 jours (onglet Actions > cette exécution > Artifacts)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: videos-${{ github.run_id }}
          path: |
            out/*.mp4
            out/*.jpg
            out/*.json
          if-no-files-found: ignore
          retention-days: 14
