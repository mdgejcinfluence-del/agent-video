# DOSSIER DE PREUVE — EXEMPLE FICTIF.
# Ce commerce, ce produit et ce prix n'existent pas : ils servent à montrer la méthode tant que tu n'as pas
# fourni un vrai cas. Le moteur affiche « EXEMPLE FICTIF » pendant toute la vidéo ; ce n'est pas réglable.
# Pour publier une vraie démonstration : copie ce dossier, remplace la photo, l'offre et les rendus par ceux
# d'un vrai commerce (avec son accord), passe « fictif » à false et signe « valide_par » (voir ../LISEZMOI.md).
id: commerce-karite-exemple
segment: commercant
fictif: true
titre: "Publicité animée d'un produit à partir d'une photo (exemple fictif : beurre de karité)"
sujets: [5, 6, 12]
metier: "boutique de cosmétiques artisanaux"

offre:                            # les seules informations que la vidéo a le droit d'afficher sur le produit
  produit: "Beurre de karité fouetté"
  format: "pot de 200 g"
  prix: "3 500 FCFA"
  consigne: "Commande par message"

produit_par:
  photo: "image d'exemple créée avec un générateur d'images le 2026-11-11 (aucun produit réel, aucune marque)"
  demande: "écrite pour cette démonstration (demande.md), puis une correction (correction.md)"
  code: "écrit par un agent de code à partir de la demande, pendant la préparation du 2026-11-11"
  rendu: "Remotion 4.0.542 — npx remotion render src/index.ts Promo"
  date: "2026-11-11"
droits: "Créé pour ce compte. Polices Inter Tight et Instrument Serif : licence SIL Open Font."

valide_par: ""
valide_le: ""

demande: demande.md
correction: correction.md
projet: ../projet-remotion
sources: [src/Promo.tsx, src/PromoCompositions.tsx, src/format.ts]

faits:
  - "Exemple fictif : produit « Beurre de karité fouetté », pot de 200 g, prix d'exemple 3 500 FCFA, consigne « Commande par message »."
  - "La publicité dure 6 secondes, en 1080 × 1920, à partir d'une seule photo."
  - "La photo n'est pas retouchée : seul un zoom lent l'anime ; le nom, le prix et la consigne sont écrits par-dessus."
  - "Premier rendu : le bandeau « Commande par message » passait devant le bas du pot."
  - "Correction demandée par écrit, puis second rendu : tout le texte est en haut, rien ne cache le produit."
  - "L'offre (nom, format, prix, consigne) est écrite à un seul endroit du projet : on la change sans refaire l'animation."
limites:
  - "Il faut un ordinateur : ce rendu n'a pas été fait depuis un téléphone."
  - "Le prix, le nom et la consigne affichés sont ceux de la demande écrite : c'est au commerçant de les vérifier avant de publier."
  - "Exemple fictif : aucune vente, aucun client, aucun résultat commercial n'est montré."

media:
  photo:
    fichier: media/photo.jpg
    description: "La photo de départ (image d'exemple) : un pot de beurre de karité fouetté sur une table en bois."
  rendu:
    fichier: media/rendu.mp4
    description: "La publicité finale (second rendu) : nom du produit, « Pot de 200 g », prix sur fond jaune, bandeau « Commande par message », le pot entièrement visible."
    depart: 2.4                   # le nom, le format et le prix sont en place ; la consigne arrive ensuite
  v1:
    fichier: media/v1.jpg
    description: "Premier rendu, image 170 : le bandeau vert passe devant le bas du pot."
    zone: {x: 14, y: 76, w: 72, h: 13}
  v2:
    fichier: media/v2.jpg
    description: "Second rendu, image 170 : tout le texte est en haut, le pot est entièrement visible."
