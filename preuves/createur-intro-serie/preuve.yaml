# DOSSIER DE PREUVE — ce que les vidéos ont le droit de montrer et d'affirmer.
# Tout ce qui est listé ici existe vraiment dans ce dossier : la demande écrite, le code, les rendus.
id: createur-intro-serie
segment: createur_freelance
fictif: false
titre: "Intro de série en motion design : de la demande écrite au MP4"
sujets: [1, 2, 3]                 # sujets de la banque (data/sujets.yaml) que cette preuve peut illustrer

produit_par:                      # traçabilité : qui a fait quoi, avec quoi, quand
  demande: "écrite pour cette démonstration (demande.md), puis une correction (correction.md)"
  code: "écrit par un agent de code à partir de la demande, pendant la préparation du 2026-11-11"
  rendu: "Remotion 4.0.542 — npx remotion render src/index.ts Intro"
  date: "2026-11-11"
droits: "Créé pour ce compte. Polices Inter Tight, Instrument Serif et JetBrains Mono : licence SIL Open Font."

# À REMPLIR PAR TOI avant toute publication : tu as regardé la demande, le code et les rendus, et tu les assumes.
# Si tu veux pouvoir dire « c'est Claude Code qui a écrit ce code », refais la démonstration dans TON Claude Code
# (colle demande.md, puis correction.md), remplace les fichiers de media/ et de ../projet-remotion/, puis signe ici.
valide_par: ""
valide_le: ""

demande: demande.md
correction: correction.md
projet: ../projet-remotion
sources: [src/Intro.tsx, src/charte.ts, src/IntroCompositions.tsx, src/format.ts]

faits:
  - "La composition dure 6 secondes : 180 images à 30 images par seconde, en 1080 × 1920."
  - "Premier rendu : le titre à 200 px dépassait du cadre, le mot « montage » était coupé à droite."
  - "Correction demandée par écrit, puis second rendu : titre à 168 px, 90 px de marge au moins de chaque côté."
  - "Les couleurs et la police sont dans un seul fichier (src/charte.ts) : changer de charte ne touche pas à l'animation."
  - "Avec la charte générique (blanc, bleu, Arial, mouvement linéaire) et avec la charte de la demande, c'est le même code d'animation."
  - "Le MP4 a été calculé par Remotion sur un ordinateur ; rien n'a été monté à la main."
limites:
  - "Il faut un ordinateur avec Node.js et un agent de code (Claude Code est payant : abonnement ou facturation à l'usage)."
  - "Remotion : licence gratuite pour les particuliers et les organisations jusqu'à 3 personnes ; payante au-delà."
  - "Sans voix ni musique : cette intro est une animation muette."

