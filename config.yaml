# =====================================================================
#  AGENT VIDÉO — réglages. Tout ce qui est ici peut être changé sans toucher au code.
#  Aucune clé ne s'écrit dans ce fichier : elles vont dans GitHub > Settings > Secrets and variables > Actions.
# =====================================================================

brand:
  name: ""                           # nom du compte (laisse vide tant qu'il n'est pas choisi)
  handle: ""                         # identifiant affiché sur l'écran de fin, ex. "@moncompte"
  promesse: "chaque jour, un prompt, une commande ou une technique d'intelligence artificielle à copier et à tester tout de suite"
  public: "des jeunes francophones d'Afrique de l'Ouest et d'Afrique centrale qui débutent avec l'IA : étudiants, entrepreneurs, commerçants, créateurs de contenu, monteurs, graphistes"
  mention_fin: "Vidéo montée par un programme"     # petite mention honnête sur l'écran de fin (vide = aucune)
  couleurs:                          # l'identité visuelle : papier quadrillé, encre, surligneur (les couleurs du personnage)
    papier: "#F5F1E8"
    encre: "#0E1A38"
    surligneur: "#FFC531"

editorial:                           # LA LIGNE ÉDITORIALE : prompts, commandes et techniques d'intelligence artificielle
  # (mission du 11 novembre 2026 ; les sujets et leur répartition sont dans data/sujets.yaml)
  outils_de_base: ["ChatGPT", "Gemini", "Claude"]     # peuvent être nommés comme l'endroit où coller une instruction
  outils_a_explorer: ["Perplexity", "DeepSeek", "Microsoft Copilot", "NotebookLM", "Canva AI", "Leonardo AI", "Midjourney", "Ideogram",
                      "Suno", "ElevenLabs", "Runway", "Kling AI", "Veo", "Gamma", "Cursor"]   # il faut un fait vérifié (page officielle) pour en décrire une fonction
  test_prompts: true                 # chaque prompt est réellement envoyé à Gemini avant la vidéo ; sans clé GEMINI_API_KEY il reste « à vérifier » et n'est pas publié

offer:                               # L'ÉCRAN DE FIN
  # Phrase dite à la fin de CHAQUE vidéo. « MOT » = le mot à commenter, « PROMESSE » = ce que la vidéo suivante apportera.
  # L'agent tient cette promesse lui-même : la suite annoncée est sa vidéo suivante.
  cta: "Abonne-toi pour ne rien rater. Et commente MOT si tu veux [p]PROMESSE."
  cta_mot_fixe: ""                   # vide = un mot par vidéo ; écris un mot pour utiliser toujours le même
  # L'E-BOOK. Il n'est PAS encore en vente : l'agent n'en parle donc dans aucune vidéo.
  # Le jour où il est en ligne : mets son adresse dans « lien_bio » et passe « en_vente » à true. C'est tout.
  lien_bio: ""                       # adresse mise dans la bio du compte (la page où l'on achète l'e-book)
  ebook:
    en_vente: false                  # true seulement quand l'e-book peut réellement être acheté
    titre: "La Bibliothèque ultime des prompts IA"
    prix: "2 500 FCFA"
    # la formulation imposée (« PRIX » est remplacé par le prix ci-dessus) :
    cta: " [promo]Et si tu veux découvrir tous les prompts pour ChatGPT, Gemini, Claude, le business, les images, les vidéos, les études et bien plus encore, notre e-book complet est disponible à seulement PRIX. Clique sur le lien en bio pour le découvrir."
    # variantes (une par vidéo, à tour de rôle) : elles gardent les trois informations — e-book complet, prix, lien en bio
    variantes:
      - " [promo]Ce prompt n'est qu'un exemple. Notre e-book complet en réunit beaucoup d'autres, pour seulement PRIX. Clique sur le lien en bio."
      - " [promo]Pour d'autres prompts, commandes et techniques d'IA, notre e-book complet est disponible à PRIX. Le lien est en bio."
    ecran: "E-book complet · *PRIX* · lien en bio"

schedule:
  timezone: "Africa/Porto-Novo"
  videos_per_day: 2
  jours: [1, 2, 3, 4, 5, 6, 7]       # jours de publication (1 = lundi … 7 = dimanche)
  slots: ["10:00", "13:00", "18:00", "20:30"]   # créneaux candidats (heure locale) ; l'agent en choisit N par jour et apprend lesquels marchent
  grace_hours: 4                     # un créneau manqué est rattrapé par un réveil arrivé dans les N heures

video:
  seconds: [38, 70]                  # durée visée (min, max)
  fps: 30
  hold_end: 2.0                      # secondes d'écran de fin après la voix
  scene_gap: 0.16                    # respiration entre deux écrans
  ajuster_debit: true                # hors format : la voix est rejouée un peu plus vite ou plus lentement (une fois)

voice:
  order: ["edge", "piper"]           # essayés dans l'ordre : edge (naturelle) | gemini (API Google, clé GEMINI_API_KEY) | piper (locale, plus « robot »)
  edge_voice: "fr-FR-RemyMultilingualNeural"   # autres : fr-FR-HenriNeural, fr-FR-VivienneMultilingualNeural, fr-FR-DeniseNeural
  rate: "+15%"                       # débit de départ ; l'agent l'ajuste ensuite pour tenir dans video.seconds
  pitch: "+0Hz"
  piper_voice: "fr_FR-siwis-medium"
  max_gap: 0.24                      # les silences plus longs sont raccourcis
  pronounce:                         # mot affiché -> mot prononcé (la voix seulement)
    "GitHub": "guite-heub"
    "Pexels": "pèxelz"
    "Pixabay": "pixa-baille"
    "rush": "reuche"
    "rushs": "reuche"
    # vérifié à l'oreille d'une machine (transcription) le 11/11/2026 : sans ces lignes, la voix dit « pron » pour « prompt » et « cha » pour « Chat »
    "prompt": "prommpt"
    "prompts": "prommpt"
    "Prompt": "prommpt"
    "Prompts": "prommpt"
    "ChatGPT": "tchat-gépété"
    "FCFA": "francs-CFA"

audio:
  music: true                        # musique générée par l'agent (aucun droit d'auteur) ; ou dépose tes .mp3 dans assets/music/
  music_db: -30
  sfx: true
  voice_margin_db: 14                # marge minimale de la voix sur le fond ; en dessous, l'agent baisse musique et bruitages
  loudness: -14                      # niveau final (LUFS)

llm:                                 # LE « CERVEAU » : l'API Gemini de Google (secret GEMINI_API_KEY)
  # L'agent lit lui-même le catalogue des modèles et prend le Flash le plus récent pour écrire,
  # le Flash-Lite le plus récent pour regarder les images. Remplis « modeles » seulement pour imposer un choix.
  modeles: {ecriture: [], controle: []}
  temperature: 0.8
  reprises: 2                        # nombre de corrections demandées au modèle quand un contrôle refuse son texte
  max_calls_per_video: 14            # écriture, essai réel du prompt, extrait de la réponse, contrôle des séquences filmées
  max_par_jour: 60                   # plafond d'appels par jour, tous modèles confondus
  groq: {model: "llama-3.3-70b-versatile"}   # secours pour le texte seul, si le secret GROQ_API_KEY existe

rushs:                               # LES SÉQUENCES FILMÉES (banques libres de droits)
  # Secrets : PEXELS_API_KEY et PIXABAY_API_KEY (gratuits). Sans eux, l'agent n'a que la bibliothèque de départ (data/rushs.yaml).
  vision: true                       # un modèle regarde trois images de chaque séquence avant de l'accepter (demande GEMINI_API_KEY)
  seuil_vision: 7                    # note minimale sur 10 donnée par le modèle
  seuil_mots: 0.5                    # sans modèle : part minimale des mots de la recherche retrouvés dans les étiquettes
  candidats_regardes: 3              # séquences téléchargées et contrôlées par besoin
  repos_jours: 10                    # une séquence déjà utilisée n'est reprise qu'après N jours (si une autre convient)

research:
  faits: true                        # rouvre chaque jour les pages officielles de data/faits.yaml
  nouveaux_faits: true               # avec Gemini : propose de nouveaux faits (outil, page officielle, citation) ; l'agent ne garde que ceux qu'il retrouve mot pour mot sur la page
  nouveaux_faits_par_semaine: 6

publish:
  dry_run: auto                      # auto = MODE ESSAI tant qu'aucune clé de publication n'existe ; dès qu'elle est ajoutée, l'agent publie
                                     # true = toujours en essai (rien n'est publié)   |   false = publication réelle
  # Une vidéo part seule si : forme et garde-fous respectés, séquences filmées contrôlées, contrôle qualité réussi.
  via: "buffer"                      # buffer (1 seule clé pour 3 réseaux) | native (API officielles de Meta et de TikTok)
  networks: ["facebook", "instagram", "tiktok"]
  ai_label: true                     # déclare la voix de synthèse aux plateformes qui le demandent
  hashtags: 8                        # au plus
  credit_rushs: true                 # ajoute « Images : Pexels (auteur)… » à la fin de la légende
  media_host: "github_pages"         # où la vidéo est hébergée pour que Buffer vienne la chercher : github_pages | cloudinary (secret CLOUDINARY_URL)
  keep_videos: 30
  tiktok_native_mode: "inbox"        # inbox = brouillon dans ton TikTok | direct = public (seulement après l'audit TikTok de ton app)

stats:
  check_after_hours: [24, 72, 168]   # relevés des statistiques après publication
  source_tiktok: "buffer"            # buffer | api
  weights: {watch: 0.35, shares: 0.25, saves: 0.20, comments: 0.20}   # note d'une vidéo : les vues seules ne désignent jamais une gagnante

bilan:                               # LE BILAN AUTOMATIQUE
  tous_les_jours: 3                  # tous les 3 jours : relevé des mesures, classement, nouveaux poids, rapport BILAN.md
  minimum_videos: 4                  # en dessous, le bilan constate mais ne change rien
  pas_max: 0.35                      # un poids ne change jamais de plus de 35 % d'un coup

strategy:
  explore: 0.25                      # part d'essais (0 = ne refait que ce qui a déjà marché)
  repeat_days: 21                    # délai avant de refaire le même sujet
  suite_sous_jours: 3                # la suite annoncée par une vidéo est produite dans les N jours
  pilotes_d_abord: true              # les sujets marqués « pilote » dans data/sujets.yaml passent avant les autres

notify:
  telegram: false                    # message Telegram après chaque vidéo (secrets TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID)
